<div
  class="w-full h-full max-w-125 max-h-120 flex flex-col bg-gray-200 rounded-xl shadow shadow-gray-500 no-scrollbar"
>
  <div class="flex items-start justify-between">
    <span
      class="font-bold py-4 pl-2 truncate hyphens-auto max-[600px]:text-lg min-[600px]:text-xl"
    >
      {{ question?.question }}
    </span>
    <div class="flex flex-row">
      <button
        #dropDownButton
        class="relative p-2 py-5"
        (click)="copyToClipboard()"
        [ngClass]="copied() ? 'MoreOptionsButtonGreen' : 'MoreOptionsButton'"
      >
        @if (copied()) {
          <mat-icon>check</mat-icon>
        } @else {
          <mat-icon>content_copy</mat-icon>
        }
      </button>
      @if (isForQuiz) {
        <button
          #dropDownButton
          class="MoreOptionsButton relative p-2 py-5"
          (click)="toggleMenu()"
          (blur)="toggleMenu()"
        >
          <mat-icon>more_vert</mat-icon>
          @if (openOptionsMenu) {
            <div
              class="absolute top-9 right-0 mr-2 mt-2 w-48 bg-white shadow-lg rounded-lg border text-cyan-950 z-1 p-2"
            >
              <div
                class="px-3 py-2 rounded bg-transparent hover:bg-gray-300 hover:text-black cursor-pointer"
                (click)="this.chatOperationService.updateExistingQuestion(clone(question!))"
              >
                Update
              </div>
              <div
                class="px-3 py-2 rounded bg-transparent hover:bg-gray-300 hover:text-black cursor-pointer"
                (click)="exportQuestionAsPDF($event)"
              >
                Export as PDF
              </div>
              <div
                class="px-3 py-2 rounded bg-transparent hover:bg-gray-300 hover:text-black cursor-pointer"
                (click)="exportQuestionAsDOC($event)"
              >
                Export as DOC
              </div>
              <div
                class="px-3 py-2 rounded bg-transparent hover:bg-gray-300 hover:text-black cursor-pointer"
                (click)="deleteQuestion()"
              >
                Delete
              </div>
            </div>
          }
        </button>
      }
    </div>
  </div>
  <div class="AnswersTable grid grid-cols-2 gap-2 p-2 w-full transition-all duration-200 my-auto">
    @for (item of question?.answers; track $index) {
      <button class="answer wrap-break-word hyphens-auto">
        {{ item.answer }}
      </button>
    }
  </div>
  @if (isForQuiz) {
    <button class="showAnswer" (click)="showCorrectAnswer()">Show Answer</button>
  }
</div>
